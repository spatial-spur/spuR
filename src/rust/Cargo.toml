[package]
name = "spur_rust"
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "spur_rust"
crate-type = ["staticlib"]

[dependencies]
extendr-api = { version = "0.7", features = ["result_condition"] }
spatial-r = { path = "spatial-r", default-features = false }
spatial-core = { path = "spatial-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package.metadata.vendor-filter]
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "aarch64-pc-windows-gnullvm",
    "x86_64-pc-windows-msvc",
]
exclude-crate-paths = [
    { name = "*", exclude = "tests" },
    { name = "*", exclude = "benches" },
    { name = "*", exclude = "examples" },
]
