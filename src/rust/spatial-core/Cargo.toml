[package]
name = "spatial-core"
version = "0.2.0"
edition = "2021"
description = "Shared numerical core for spatial SCPC and SPUR"
license = "MIT"

[features]
portable = ["dep:faer"]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std"], optional = true }
rayon = "1.10"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }
