name: Tests

on:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main, rust-core]
  workflow_dispatch:
    inputs:
      spatial_rust_ref:
        description: Matching spatial-rust branch, tag, or commit
        type: string
      scpcr_ref:
        description: Matching scpcR branch, tag, or commit
        type: string
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      scpcr_sha: ${{ steps.scpcr.outputs.commit }}
    steps:
      - name: Check dependency revisions
        shell: bash
        working-directory: .
        env:
          SPATIAL_RUST_REF: ${{ inputs.spatial_rust_ref || vars.SPATIAL_RUST_REF || ((github.ref_name == 'rust-core' || github.base_ref == 'rust-core') && github.event_name != 'release' && 'rust-core') }}
          SCPCR_REF: ${{ inputs.scpcr_ref || vars.SCPCR_REF || ((github.ref_name == 'rust-core' || github.base_ref == 'rust-core') && github.event_name != 'release' && 'rust-core') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != release && ("$GITHUB_REF_NAME" == rust-core || "$GITHUB_BASE_REF" == rust-core) ]]; then
            exit 0
          fi
          if [[ ! "$SPATIAL_RUST_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Set SPATIAL_RUST_REF to the matching full commit SHA for this branch or release." >&2
            exit 1
          fi
          if [[ ! "$SCPCR_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Set SCPCR_REF to the matching full commit SHA for this branch or release." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          path: spuR
          persist-credentials: false
      - uses: actions/checkout@v6
        id: scpcr
        with:
          repository: spatial-spur/scpcR
          ref: ${{ inputs.scpcr_ref || vars.SCPCR_REF || ((github.ref_name == 'rust-core' || github.base_ref == 'rust-core') && github.event_name != 'release' && 'rust-core') }}
          path: scpcR
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: spatial-spur/spatial-rust
          ref: ${{ inputs.spatial_rust_ref || vars.SPATIAL_RUST_REF || ((github.ref_name == 'rust-core' || github.base_ref == 'rust-core') && github.event_name != 'release' && 'rust-core') }}
          path: spatial-rust
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-vendor-filterer
        shell: bash
        run: cargo install --locked cargo-vendor-filterer --version 0.5.18
      - name: Build the standalone source archives
        shell: bash
        run: |
          bash spatial-rust/scripts/build_r_source.sh scpcR standalone
          bash spatial-rust/scripts/build_r_source.sh spuR standalone
          cp spatial-rust/scripts/check_r_library.R standalone/
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-r-source
          path: standalone
          if-no-files-found: error
          retention-days: 2

  test:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['0', '1']
    runs-on: ${{ matrix.os }}
    env:
      SPATIAL_RUST: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: spuR
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: spatial-spur/scpcR
          ref: ${{ needs.source.outputs.scpcr_sha }}
          path: scpcR
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: standalone-r-source
          path: standalone
      - uses: r-lib/actions/setup-r@v2
      - name: Use the minimum supported Rust toolchain on Linux
        if: runner.os == 'Linux' && matrix.rust == '1'
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          printf 'RUSTUP_TOOLCHAIN=1.85.0\n' >> "$GITHUB_ENV"
      - name: Set up Rust for Rtools
        if: runner.os == 'Windows' && matrix.rust == '1'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: spuR
          extra-packages: local::../scpcR
          install-pandoc: 'true'
          cache-version: rust-${{ matrix.rust }}
      - name: Install directly from the checkout
        shell: bash
        run: |
          R CMD INSTALL scpcR
          R CMD INSTALL spuR
      - name: Check the checkout install
        run: Rscript standalone/check_r_library.R scpcR spuR
      - name: Install the source archives with an empty offline Cargo cache
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          CARGO_HOME: ${{ runner.temp }}/r-offline-cargo
        run: |
          R CMD INSTALL --install-tests standalone/scpcR_*.tar.gz
          R CMD INSTALL --install-tests standalone/spuR_*.tar.gz
      - name: Verify the installed libraries and registered routines
        run: Rscript standalone/check_r_library.R scpcR spuR
      - name: Run the installed tests
        shell: Rscript {0}
        run: testthat::test_package("spuR", stop_on_failure = TRUE)
      - name: Check the standalone archive in CRAN mode
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          CARGO_HOME: ${{ runner.temp }}/r-offline-cargo
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
        run: |
          R CMD check --as-cran --no-manual --no-tests --output="$RUNNER_TEMP" standalone/spuR_*.tar.gz
          if grep -E '^Status: .*WARNING' "$RUNNER_TEMP/spuR.Rcheck/00check.log"; then
            exit 1
          fi
