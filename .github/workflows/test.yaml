name: Tests

on:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main, rust-core]
  workflow_dispatch:
    inputs:
      scpcr_ref:
        description: Matching scpcR branch, tag, or commit
        default: rust-core

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['0', '1']

    runs-on: ${{ matrix.os }}
    env:
      SPATIAL_RUST: ${{ matrix.rust }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Rust target for Rtools
        if: runner.os == 'Windows' && matrix.rust == '1'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check out matching scpcR development branch
        id: scpcr
        uses: actions/checkout@v6
        with:
          repository: spatial-spur/scpcR
          ref: ${{ inputs.scpcr_ref || 'rust-core' }}
          path: scpcR-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::scpcR-dev, any::testthat, any::geodist
          cache-version: rust-${{ matrix.rust }}-scpcr-${{ steps.scpcr.outputs.commit }}

      - name: Run tests
        run: >-
          Rscript -e 'pkgload::load_all(quiet = TRUE);
          native <- Sys.getenv("SPATIAL_RUST") == "1";
          stopifnot(is.loaded("wrap__rust_run_spur_i0", PACKAGE = "spuR") == native,
          is.loaded("wrap__rust_run_exact_scpc", PACKAGE = "scpcR") == native);
          testthat::test_local(stop_on_failure = TRUE)'
